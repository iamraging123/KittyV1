name: Deploy KittyV1 visualizer to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'Website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and let one concurrent deploy run.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Website folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
